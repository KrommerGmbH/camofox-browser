name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  docker:
    needs: windows-portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/redf0x1/camofox-browser
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install build dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Verify source and npm package contracts
        run: |
          npm run lint
          npm run verify:package
          npm audit --omit=dev --audit-level=moderate

      - name: Build portable Windows x64 ZIP
        run: npm run build:portable:windows

      - name: Verify extracted portable runtime from path with spaces
        id: portable
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path 'build/portable-windows' -Filter 'camofox-browser-*-windows-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Portable Windows ZIP was not produced.' }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'Portable Package'
          if (Test-Path $extractRoot) { Remove-Item -Recurse -Force $extractRoot }
          New-Item -ItemType Directory -Path $extractRoot | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extractRoot

          $bundle = Get-ChildItem -Path $extractRoot -Directory | Select-Object -First 1
          if (-not $bundle) { throw 'Portable Windows ZIP did not contain a bundle directory.' }

          $bundledNode = Join-Path $bundle.FullName 'node\node.exe'
          & $bundledNode (Join-Path $env:GITHUB_WORKSPACE 'scripts\verify-portable-windows.mjs') $bundle.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "zip_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT

      - name: Stage verified portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: camofox-browser-windows-x64
          path: ${{ steps.portable.outputs.zip_path }}
          if-no-files-found: error
          compression-level: 0

  github-release:
    needs: [windows-portable, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified portable ZIP
        uses: actions/download-artifact@v8
        with:
          name: camofox-browser-windows-x64
          path: release-artifacts

      - name: Publish portable ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP=$(find release-artifacts -type f -name 'camofox-browser-*-windows-x64.zip' -print -quit)
          test -n "$ZIP"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --generate-notes --title "camofox-browser $GITHUB_REF_NAME"
          fi
